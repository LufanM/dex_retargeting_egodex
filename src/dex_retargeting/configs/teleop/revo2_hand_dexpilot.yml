left:
  type: DexPilot
  urdf_path: revo2_hand/revo2_left_hand.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ 'left_pinky_proximal_joint', 'left_ring_proximal_joint', 'left_middle_proximal_joint', 'left_index_proximal_joint',
                        'left_thumb_proximal_joint', 'left_thumb_metacarpal_joint' ]
  
  # For cal the hand pose of robot hand, we need to specify the wrist link and finger tip links. 
  # The hand pose vector that used to optimal algorithms is calculated based on the wrist link and finger tip links.                      
  wrist_link_name: "left_base_link"
  finger_tip_link_names: [ "left_thumb_tip_link",  "left_index_tip_link", "left_middle_tip_link", "left_ring_tip_link", "left_pinky_tip_link" ]
  
  # If you do not know exactly how it is used, please leave it to None for default.
  # Each finger tip link index corresponds to a human keypoint index. ** The human keypoint index is defined in the dataset **.
  target_link_human_indices: [[ 9, 14, 19, 24, 14, 19, 24, 19, 24, 24,  0,  0,  0,  0,  0], [ 4,  4,  4,  4,  9, 9,  9, 14, 14, 19,  4,  9, 14, 19, 24]]

  # Scaling factor for vector retargeting only
  # For example, Allegro is 1.6 times larger than normal human hand, then this scaling factor should be 1.6
  scaling_factor: 0.9

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2


right:
  type: DexPilot
  urdf_path: revo2_hand/revo2_right_hand.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ 'right_pinky_proximal_joint', 'right_ring_proximal_joint', 'right_middle_proximal_joint', 'right_index_proximal_joint',
                        'right_thumb_proximal_joint', 'right_thumb_metacarpal_joint' ]


  # For cal the hand pose vector of robot hand, we need to specify the wrist link and finger tip links. 
  # The hand pose vector that used to optimal algorithms is calculated based on the wrist link and finger tip links.                      
  wrist_link_name: "right_base_link"
  finger_tip_link_names: [ "right_thumb_tip_link",  "right_index_tip_link", "right_middle_tip_link", "right_ring_tip_link", "right_pinky_tip_link" ]
  
  # If you do not know exactly how it is used, please leave it to None for default.
  # Each finger tip link index corresponds to a human keypoint index. The human keypoint index is defined in the dataset.
  target_link_human_indices: [[ 9, 14, 19, 24, 14, 19, 24, 19, 24, 24,  0,  0,  0,  0,  0], [ 4,  4,  4,  4,  9, 9,  9, 14, 14, 19,  4,  9, 14, 19, 24]]

  # Scaling factor for vector retargeting only
  # For example, Allegro is 1.6 times larger than normal human hand, then this scaling factor should be 1.6
  scaling_factor: 0.9

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
