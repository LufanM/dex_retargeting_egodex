left:
  type: DexPilot
  urdf_path: sharpa_hand/sharpa_left_hand.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [
    'left_thumb_CMC_FE', 'left_thumb_CMC_AA', 'left_thumb_MCP_FE', 'left_thumb_MCP_AA', 'left_thumb_IP',
    'left_index_MCP_FE', 'left_index_MCP_AA', 'left_index_PIP', 'left_index_DIP',
    'left_middle_MCP_FE', 'left_middle_MCP_AA', 'left_middle_PIP', 'left_middle_DIP',
    'left_ring_MCP_FE', 'left_ring_MCP_AA', 'left_ring_PIP', 'left_ring_DIP',
    'left_pinky_CMC', 'left_pinky_MCP_FE', 'left_pinky_MCP_AA', 'left_pinky_PIP', 'left_pinky_DIP',
  ]
  
  # For cal the hand pose of robot hand, we need to specify the wrist link and finger tip links. 
  # The hand pose vector that used to optimal algorithms is calculated based on the wrist link and finger tip links.                      
  wrist_link_name: "left_hand_C_MC"
  finger_tip_link_names: ["left_thumb_fingertip",  "left_index_fingertip", "left_middle_fingertip", "left_ring_fingertip", "left_pinky_fingertip"]
  
  # If you do not know exactly how it is used, please leave it to None for default.
  # Each finger tip link index corresponds to a human keypoint index. ** The human keypoint index is defined in the dataset **.
  target_link_human_indices: [[ 9, 14, 19, 24, 14, 19, 24, 19, 24, 24,  0,  0,  0,  0,  0], [ 4,  4,  4,  4,  9, 9,  9, 14, 14, 19,  4,  9, 14, 19, 24]]

  # Scaling factor for vector retargeting only
  # For example, Allegro is 1.6 times larger than normal human hand, then this scaling factor should be 1.6
  scaling_factor: 1.2

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2


