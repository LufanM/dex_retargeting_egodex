retargeting:
  type: DexPilot
  urdf_path: wuji_hand/wuji_right_hand.urdf

  # Target refers to the retargeting target, which is the robot hand
  # 20 DOF: 5 fingers × 4 joints each
  target_joint_names: [
    'right_finger1_joint1', 'right_finger1_joint2', 'right_finger1_joint3', 'right_finger1_joint4',
    'right_finger2_joint1', 'right_finger2_joint2', 'right_finger2_joint3', 'right_finger2_joint4',
    'right_finger3_joint1', 'right_finger3_joint2', 'right_finger3_joint3', 'right_finger3_joint4',
    'right_finger4_joint1', 'right_finger4_joint2', 'right_finger4_joint3', 'right_finger4_joint4',
    'right_finger5_joint1', 'right_finger5_joint2', 'right_finger5_joint3', 'right_finger5_joint4',
  ]


  # For cal the hand pose vector of robot hand, we need to specify the wrist link and finger tip links. 
  # The hand pose vector that used to optimal algorithms is calculated based on the wrist link and finger tip links.                      
  wrist_link_name: "right_palm_link"
  finger_tip_link_names: [ "right_finger1_tip_link", "right_finger2_tip_link", "right_finger3_tip_link", "right_finger4_tip_link", "right_finger5_tip_link" ]
  
  # Scaling factor for vector retargeting only
  # For example, Allegro is 1.6 times larger than normal human hand, then this scaling factor should be 1.6
  scaling_factor: 1.3

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2