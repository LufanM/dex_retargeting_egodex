retargeting:
  type: DexPilot
  urdf_path: revo2_hand/revo2_left_hand.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ 'left_pinky_proximal_joint', 'left_ring_proximal_joint', 'left_middle_proximal_joint', 'left_index_proximal_joint',
                        'left_thumb_proximal_joint', 'left_thumb_metacarpal_joint' ]
  wrist_link_name: "left_base_link"
  finger_tip_link_names: [ "left_thumb_tip_link",  "left_index_tip_link", "left_middle_tip_link", "left_ring_tip_link", "left_pinky_tip_link" ]
  scaling_factor: 1.15

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2
