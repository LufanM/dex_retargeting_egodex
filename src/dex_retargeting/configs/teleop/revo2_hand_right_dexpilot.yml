retargeting:
  type: DexPilot
  urdf_path: revo2_hand/revo2_right_hand.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: [ 'right_pinky_proximal_joint', 'right_ring_proximal_joint', 'right_middle_proximal_joint', 'right_index_proximal_joint',
                        'right_thumb_proximal_joint', 'right_thumb_metacarpal_joint' ]
  wrist_link_name: "right_base_link"
  finger_tip_link_names: [ "right_thumb_tip_link",  "right_index_tip_link", "right_middle_tip_link", "right_ring_tip_link", "right_pinky_tip_link" ]
  scaling_factor: 1.15

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2
